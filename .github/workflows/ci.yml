name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y shellcheck shunit2

      - name: Lint with shellcheck
        run: |
          shellcheck scripts/addition.sh scripts/evenodd.sh scripts/factorial.sh

      - name: Test with shunit2
        run: |
          bash tests/test_scripts.sh

      - name: Build (syntax check)
        run: |
          bash -n scripts/*.sh
